pid /tmp/nginx.pid;
error_log /dev/stderr;

events {}

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Headers against clickjacking, content sniffing and injected scripts. The scripts, styles, fonts and requests of the
    # page come from the site itself; styles may be inline (React and the component library set them on elements).
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger UI of the server (it lives at /swagger there, outside /api).
    location /swagger {
      proxy_pass http://127.0.0.1:3001;
      proxy_set_header Host $host;
    }

    # Admin panel talks to the external-systems mock.
    location /external-api/ {
      proxy_pass http://127.0.0.1:5006/api/;
      proxy_set_header Host $host;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
