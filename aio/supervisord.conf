[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:server]
command=node dist/index.js
directory=/app/server
environment=PORT="3001",BANK_API="http://127.0.0.1:5006/api/banks"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:external-systems]
command=node dist/index.js
directory=/app/external-systems
environment=PORT="5006"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ml]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/ml
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
