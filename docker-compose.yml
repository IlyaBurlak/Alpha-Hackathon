services:
  ml:
    build: ./ml
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BANK_API: http://external-systems:5006/api/banks
      CREDIT_BUREAU_API: http://external-systems:5006/api/credit-bureaus
      REGISTER_API: http://external-systems:5006/api/register
      ML_SCORING_API: http://ml:8000/
    volumes:
      - server-data:/app/data
    depends_on:
      ml:
        condition: service_healthy
      external-systems:
        condition: service_healthy

  external-systems:
    build:
      context: .
      dockerfile: externalSystemsMock/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5006

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
      external-systems:
        condition: service_healthy

volumes:
  server-data:
