# Параметры расчёта. Формула балла, классы риска и надбавки к ставке
# пока лежат в app/scoring_math.py (переедут сюда на шаге 7).

factors:
  max_count: 7            # сколько факторов показывать в интерфейсе

# Стоп-факторы ограничивают балл сверху значением score_cap.
stop_factors:
  score_cap: 30
  min_business_age_months: 6
  max_delayed_payment_cases: 3   # допущение: уточнить у команды

# Пороги интерфейса, которые попадают в тексты факторов (ключ - признак).
thresholds:
  debt_service_ratio: 0.30