# Тексты факторов. В шаблонах доступны:
#   {value}     - значение признака у заявки (после ограничения выбросов)
#   {typical}   - типичное значение (медиана обучения)
#   {threshold} - порог из scoring.yaml, если он там есть
# advice показывается только у факторов с отрицательными баллами.

common:
  clipped_note: "Значение вне диапазона обучающих данных, в расчёте ограничено."

factors:
  business_age_months:
    title: Возраст бизнеса
    description: "Бизнес работает {value:.0f} мес. (типичное значение {typical:.0f})."
    advice: "Возраст бизнеса быстро не изменить: уменьшите сумму или срок кредита."
  is_sole_proprietor:
    title: Форма собственности
    description: "Организационная форма: {value}."
    values: {true: "ИП", false: "организация"}
    advice: "Форму собственности не изменить: уменьшите сумму кредита."
  okved_group:
    title: Сфера деятельности
    description: "Основная сфера: {value}."
    values: {trade: "торговля", manufacturing: "производство", services: "услуги", other: "прочее"}
    advice: "Сфера влияет на оценку риска: уменьшите сумму кредита."
  avg_revenue_monthly:
    title: Среднемесячная выручка
    description: "Выручка около {value:.0f} ₽ в месяц (типичное значение {typical:.0f} ₽)."
    advice: "Запросите сумму поменьше или подайте заявку, когда выручка вырастет."
  expense_ratio:
    title: Доля расходов
    description: "Расходы составляют {value:.0%} выручки (типичное значение {typical:.0%})."
    advice: "Снижение доли расходов в выручке повысит оценку."
  revenue_cv:
    title: Стабильность оборота
    description: "Остатки по счёту колеблются на {value:.0%} от среднего (типичное значение {typical:.0%})."
    advice: "Более ровный оборот по счёту повысит оценку."
  employees_count:
    title: Численность сотрудников
    description: "В штате {value:.0f} чел. (типичное значение {typical:.0f})."
    advice: "Оценка учитывает масштаб бизнеса: уменьшите сумму кредита."
  bank_client_months:
    title: Стаж клиента банка
    description: "Вы клиент банка {value:.0f} мес. (типичное значение {typical:.0f})."
    advice: "Стаж растёт со временем: пока можно уменьшить сумму кредита."
  active_loans_count:
    title: Действующие кредиты
    description: "Действующих кредитов: {value:.0f}."
    advice: "Погасите часть действующих кредитов до подачи заявки."
  debt_service_ratio:
    title: Долговая нагрузка
    description: "Платежи по действующим кредитам составляют {value:.0%} месячной выручки (порог {threshold:.0%})."
    advice: "Снизьте текущие платежи по кредитам или запросите меньшую сумму."
  delayed_payment_cases:
    title: Просрочки по кредитам
    description: "Случаев просрочки в кредитной истории: {value:.0f}."
    advice: "Закройте просроченные платежи: новые просрочки снижают оценку."
  requested_to_monthly_revenue:
    title: Размер запроса
    description: "Запрошенная сумма равна {value:.0f} среднемесячным выручкам (типичное значение {typical:.0f})."
    advice: "Уменьшите сумму кредита или увеличьте срок."
  term_months:
    title: Срок кредита
    description: "Срок кредита {value:.0f} мес. (типичное значение {typical:.0f})."
    advice: "Выберите срок ближе к типичному или уменьшите сумму."

# Стоп-факторы: ограничивают балл сверху (scoring.yaml -> stop_factors.score_cap).
stop_factors:
  inactive:
    title: Компания не действует
    description: "По данным реестра компания не является действующей."
    advice: "Кредит доступен только действующей компании: уточните статус в ЕГРЮЛ."
  bankrupt:
    title: Банкротство
    description: "Бюро кредитных историй сообщает о банкротстве."
    advice: "При банкротстве кредит недоступен: обратитесь за консультацией в банк."
  young_business:
    title: Слишком молодой бизнес
    description: "Бизнес работает {value:.0f} мес., минимум {threshold:.0f} мес."
    advice: "Подайте заявку, когда бизнес проработает не менее {threshold:.0f} мес."
  delayed_cases:
    title: Много просрочек
    description: "Случаев просрочки: {value:.0f}, допустимо не более {threshold:.0f}."
    advice: "Погасите просроченные платежи и подайте заявку снова."