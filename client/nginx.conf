server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Admin panel talks to the external-systems mock, which has no CORS of its own.
  location /external-api/ {
    proxy_pass http://external-systems:5006/api/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
