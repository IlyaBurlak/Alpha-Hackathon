services:
  ml:
    image: node:24.4.1-alpine
    command: >
      node -e "require('http').createServer((_,res)=>{res.writeHead(200);res.end('{\"status\":\"ok\"}')}).listen(8000)"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Real mock — BANK_API is actually called by gateway.service.ts.
  external-systems:
    build:
      context: .
      dockerfile: externalSystemsMock/Dockerfile
    environment:
      PORT: 5006

  # Real production image, same as docker-compose.yml, env mirrored from it.
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      JWT_SECRET: ci-integration-test-secret
      ML_SERVICE_URL: http://ml:8000
      BANK_API: http://external-systems:5006/api/banks
      CREDIT_BUREAU_API: http://external-systems:5006/api/credit-bureaus
      REGISTER_API: http://external-systems:5006/api/register
      ML_SCORING_API: http://ml:8000/
    depends_on:
      ml:
        condition: service_healthy
      external-systems:
        condition: service_healthy

  integration-tests:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: integration-test
    environment:
      SERVER_BASE_URL: http://server:3001
      EXTERNAL_SYSTEMS_BASE_URL: http://external-systems:5006
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./allure-results:/app/allure-results
